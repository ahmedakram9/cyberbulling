<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cyberbullying Mission</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3FF; --surface:#FFFFFF; --surface-2:#E1E9FF; --ink:#16215C; --ink-soft:#4A5590;
  --blue:#3A5BFF; --on-blue:#FFFFFF; --sun:#FFC933; --mint:#12966A; --mint-bg:#D9F6EA;
  --coral:#D93A42; --coral-bg:#FFE2E3;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1433; --surface:#18204A; --surface-2:#222C62; --ink:#EEF1FF; --ink-soft:#AEB7E6;
    --blue:#7D93FF; --on-blue:#0E1433; --sun:#FFD457; --mint:#3DDC97; --mint-bg:#12392F;
    --coral:#FF7C82; --coral-bg:#45202A;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1433; --surface:#18204A; --surface-2:#222C62; --ink:#EEF1FF; --ink-soft:#AEB7E6;
  --blue:#7D93FF; --on-blue:#0E1433; --sun:#FFD457; --mint:#3DDC97; --mint-bg:#12392F;
  --coral:#FF7C82; --coral-bg:#45202A;
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Lexend,"Segoe UI",system-ui,sans-serif;font-size:18px;line-height:1.5}
h1,h2{font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;line-height:1.05;margin:0 0 8px;font-weight:800}
h1{font-size:clamp(2.2rem,8vw,3.2rem)}
h2{font-size:clamp(1.7rem,6vw,2.2rem)}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 40px}

.progress{display:flex;gap:6px;margin:4px 0 16px}
.progress i{flex:1;height:10px;border-radius:99px;background:var(--surface-2);border:2px solid var(--ink)}
.progress i.on{background:var(--sun)}

.guide{display:flex;gap:12px;align-items:center;margin:8px 0 14px}
.guide svg{width:72px;flex:0 0 72px}
.bubble{background:var(--surface);border:2px solid var(--ink);border-radius:18px;padding:10px 14px;flex:1}
.hop{animation:hop .45s ease-out}
@keyframes hop{40%{transform:translateY(-12px)}}

.panel{background:var(--surface);border:2px solid var(--ink);border-radius:22px;padding:22px;box-shadow:0 6px 0 var(--ink);text-align:center}
.big{font-size:4rem;line-height:1}
.what{font-family:"Baloo 2",system-ui,sans-serif;font-size:1.8rem;font-weight:700;margin:6px 0}
.small{color:var(--ink-soft);font-size:.95rem}

.btn{font:600 1.05rem Lexend,system-ui,sans-serif;padding:14px 18px;border-radius:14px;border:2px solid var(--ink);background:var(--surface);color:var(--ink);box-shadow:0 4px 0 var(--ink);cursor:pointer;width:100%;transition:transform .08s,box-shadow .08s}
.btn:active:not([disabled]){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--blue);color:var(--on-blue)}
.btn[disabled]{cursor:default}
.btn.right{background:var(--mint-bg);border-color:var(--mint);box-shadow:0 4px 0 var(--mint)}
.btn.wrong{background:var(--coral-bg);border-color:var(--coral);box-shadow:0 4px 0 var(--coral);opacity:.7}
.btn:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.list{display:grid;gap:10px;margin-top:14px;text-align:left}
.pw{font-family:ui-monospace,Consolas,monospace;font-size:1.3rem}

.fb{border:2px solid;border-radius:16px;padding:12px 14px;margin-top:14px;text-align:left}
.fb.good{background:var(--mint-bg);border-color:var(--mint)}
.fb.bad{background:var(--coral-bg);border-color:var(--coral)}
.next{margin-top:14px}

.defn{font-size:1.2rem;font-weight:500;background:var(--sun);color:#16215C;border:2px solid var(--ink);border-radius:18px;padding:16px;margin:14px 0 18px}
.rules{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:6px 0 4px}
.rule{background:var(--surface-2);border:2px solid var(--ink);border-radius:99px;padding:6px 14px;font-weight:600}

.phone{border:3px solid var(--ink);border-radius:26px;background:var(--surface-2);padding:12px;text-align:left}
.msg{background:var(--surface);border:2px solid var(--ink);border-radius:16px 16px 16px 4px;padding:8px 12px;margin:8px 0;max-width:90%;animation:pop .25s ease-out}
.msg b{display:block;font-size:.8rem;color:var(--coral)}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.steps{display:grid;gap:8px;margin-top:12px;text-align:left}
.step{background:var(--mint-bg);border:2px solid var(--mint);border-radius:14px;padding:10px 14px;font-weight:500}

.stars{font-size:2.6rem;letter-spacing:6px;margin:8px 0}
.recap{text-align:left;margin:12px auto 0;max-width:420px;padding-left:1.2em}
.recap li{margin:6px 0}

.topbar{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.topbar .progress{flex:1;margin:0}
.score{font:800 1.3rem "Baloo 2",system-ui,sans-serif;background:var(--surface);border:2px solid var(--ink);border-radius:99px;padding:2px 14px;white-space:nowrap}
.score.bump{animation:bump .4s ease-out}
@keyframes bump{40%{transform:scale(1.3)}}
.plus{position:fixed;font:800 1.6rem "Baloo 2",system-ui,sans-serif;color:var(--mint);pointer-events:none;animation:float 0.9s ease-out forwards;z-index:5}
@keyframes float{to{transform:translateY(-60px);opacity:0}}
.enter{animation:enter .35s ease-out}
@keyframes enter{from{transform:translateX(40px) rotate(3deg);opacity:0}}
.wobble{display:inline-block;animation:wobble 1.6s ease-in-out infinite}
@keyframes wobble{50%{transform:rotate(-8deg) scale(1.08)}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.typing{display:inline-flex;gap:4px;padding:10px 14px;background:var(--surface);border:2px solid var(--ink);border-radius:16px;margin:8px 0}
.typing i{width:8px;height:8px;border-radius:50%;background:var(--ink-soft);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.2}}
.step{opacity:0;transform:translateY(8px);transition:opacity .35s,transform .35s}
.step.on{opacity:1;transform:none}
.piles{display:flex;justify-content:center;gap:10px;margin-top:12px;font-weight:600}
.pile{background:var(--surface-2);border:2px solid var(--ink);border-radius:12px;padding:4px 12px}
.stars span{display:inline-block;animation:popstar .5s ease-out both}
.stars span:nth-child(2){animation-delay:.25s}.stars span:nth-child(3){animation-delay:.5s}
@keyframes popstar{from{transform:scale(0) rotate(-90deg)}70%{transform:scale(1.3)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:10}
.intro{display:grid;gap:8px;margin:0 0 18px;text-align:left}
.intro div{background:var(--surface);border:2px solid var(--ink);border-radius:14px;padding:10px 14px;font-weight:500}
.hidden-msg{background:var(--coral-bg);border-color:var(--coral);font-weight:500}
.jamie{background:var(--surface);border:2px dashed var(--ink);border-radius:14px;padding:8px 12px;margin-top:10px;text-align:center;font-weight:500;animation:pop .25s ease-out}
.word{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0 4px;font:800 1.6rem "Baloo 2",system-ui,sans-serif}
.word span{background:var(--surface);border:2px solid var(--ink);border-radius:14px;padding:4px 14px}
.scene{font-size:1.25rem;font-weight:500;margin:6px 0 4px}
.opt-sub{display:block;font-weight:400;font-size:.9rem;color:var(--ink-soft)}
.positive{background:var(--mint-bg);border:2px solid var(--mint);border-radius:16px;padding:12px 14px;margin-top:14px;font-weight:600}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="progress" id="progress" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="score" id="score" aria-label="Stars">⭐ 0</div>
  </div>
  <canvas id="confetti"></canvas>
  <main id="stage" aria-live="polite"></main>
</div>

<script>
const $ = s => document.querySelector(s);
const stage = $('#stage');
const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(x => x[1]);
let stars = 0;
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait = ms => new Promise(r => setTimeout(r, reduced ? 100 : ms));
function updateScore(bump) {
  const s = $('#score');
  s.textContent = '⭐ ' + stars;
  if (bump) { s.classList.remove('bump'); void s.offsetWidth; s.classList.add('bump'); }
}
function plusOne(el) {
  if (reduced) return;
  const r = el.getBoundingClientRect();
  const p = document.createElement('div');
  p.className = 'plus'; p.textContent = '+1 ⭐';
  p.style.left = (r.left + r.width / 2 - 30) + 'px'; p.style.top = (r.top - 10) + 'px';
  document.body.appendChild(p);
  setTimeout(() => p.remove(), 900);
}
function shake(el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
function confetti() {
  if (reduced) return;
  const c = $('#confetti'), ctx = c.getContext('2d');
  c.width = innerWidth; c.height = innerHeight;
  const cols = ['#3A5BFF', '#FFC933', '#12966A', '#D93A42', '#7D93FF'];
  const bits = Array.from({ length: 140 }, () => ({
    x: c.width / 2, y: c.height / 3, vx: (Math.random() - .5) * 14, vy: Math.random() * -14 - 4,
    s: Math.random() * 8 + 5, r: Math.random() * 6, col: cols[Math.floor(Math.random() * cols.length)]
  }));
  let t = 0;
  (function frame() {
    ctx.clearRect(0, 0, c.width, c.height);
    bits.forEach(b => {
      b.vy += .35; b.x += b.vx; b.y += b.vy; b.r += .1;
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r); ctx.fillStyle = b.col;
      ctx.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2); ctx.restore();
    });
    if (++t < 150) requestAnimationFrame(frame); else ctx.clearRect(0, 0, c.width, c.height);
  })();
}

function mascot(mood) {
  const mouth = mood === 'sad'
    ? '<path d="M40 70 Q50 62 60 70" fill="none" stroke="#16215C" stroke-width="4" stroke-linecap="round"/>'
    : '<path d="M38 64 Q50 76 62 64" fill="none" stroke="#16215C" stroke-width="4" stroke-linecap="round"/>';
  return `<svg viewBox="0 0 100 104" aria-hidden="true">
    <path d="M50 6 L88 20 V50 C88 74 70 92 50 98 C30 92 12 74 12 50 V20 Z" fill="#3A5BFF" stroke="#16215C" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="38" cy="49" r="8" fill="#fff"/><circle cx="62" cy="49" r="8" fill="#fff"/>
    <circle cx="39" cy="50" r="4.2" fill="#16215C"/><circle cx="63" cy="50" r="4.2" fill="#16215C"/>
    ${mouth}
    <path d="M78 6 l3 7 7 1 -5 5 1.5 7 -6.5 -3.5 -6.5 3.5 1.5 -7 -5 -5 7 -1z" fill="#FFC933" stroke="#16215C" stroke-width="2"/>
  </svg>`;
}
const guide = (text, mood = 'happy') =>
  `<div class="guide"><div id="face">${mascot(mood)}</div><div class="bubble">${text}</div></div>`;
function face(mood) {
  const f = $('#face'); if (!f) return;
  f.innerHTML = mascot(mood);
  f.classList.remove('hop'); void f.offsetWidth; if (mood !== 'sad') f.classList.add('hop');
}
function setProgress(n) {
  document.querySelectorAll('#progress i').forEach((b, i) => b.classList.toggle('on', i < n));
}

/* Shared: one question with buttons. Right answer = move on. Wrong = explain, try again. */
function question(host, q, done) {
  host.innerHTML = `<div class="${q.grid ? 'grid2' : 'list'}">${q.options.map((o, i) =>
    `<button class="btn ${q.cls || ''}" data-i="${i}">${o}</button>`).join('')}</div><div id="fb"></div>`;
  const btns = [...host.querySelectorAll('.btn')];
  let firstTry = true;
  btns.forEach(b => b.onclick = () => {
    const i = +b.dataset.i;
    if (i === q.answer) {
      b.classList.add('right');
      btns.forEach(x => x.disabled = true);
      if (firstTry) { stars++; updateScore(true); plusOne(b); }
      face('happy');
      q.onRight && q.onRight();
      $('#fb').innerHTML = `<div class="fb good"><b>Correct!</b> ${q.why}</div>
        <button class="btn primary next" id="go">Next</button>`;
      $('#go').onclick = done;
      $('#go').focus();
    } else {
      firstTry = false;
      b.classList.add('wrong'); b.disabled = true;
      shake(b);
      face('sad');
      $('#fb').innerHTML = `<div class="fb bad"><b>Not quite.</b> ${q.hint} Try again!</div>`;
    }
  });
}

/* START */
let total = 0;
function start() {
  stars = 0; setProgress(0); updateScore(false);
  stage.innerHTML = `
    ${guide('Hi, I’m Shield! 👋 Today we’re learning about cyberbullying. Collect as many stars as you can!')}
    <h1>Cyberbullying Mission</h1>
    <div class="word" aria-label="Cyber plus bullying"><span>💻 Cyber</span>+<span>Bullying</span></div>
    <p class="defn"><b>Cyberbullying</b> is the bullying of another person using the internet, mobile phones and other digital devices.</p>
    <div class="intro">
      <div>🔎 Spot the different types of cyberbullying</div>
      <div>✅ True or false?</div>
      <div>🛡️ Know how to stay safe</div>
    </div>
    <button class="btn primary" id="go">Start the mission</button>`;
  $('#go').onclick = part1;
}

/* PART 1: name the type (5 situations, 3 choices each) */
const TYPES = {
  Harassment: 'Sending mean or threatening messages again and again',
  Exclusion: 'Leaving someone out online on purpose',
  Impersonation: 'Pretending to be someone else to cause trouble',
  Outing: 'Sharing someone’s private information or photos without permission',
  Trolling: 'Posting upsetting or annoying messages just to cause trouble'
};
function part1() {
  setProgress(1);
  const cards = shuffle([
    ['📱', 'A student keeps getting mean messages from the same person every single day.', 'Harassment'],
    ['👥', 'A group makes a new group chat and leaves one classmate out on purpose.', 'Exclusion'],
    ['👤', 'Someone makes a fake account pretending to be another student and posts things as them.', 'Impersonation'],
    ['📷', 'Someone shares a private photo of a classmate without asking them.', 'Outing'],
    ['💬', 'Someone posts comments under lots of videos just to upset people and cause trouble.', 'Trolling']
  ]);
  let i = 0;
  const show = () => {
    if (i >= cards.length) return part2();
    const [em, scene, type] = cards[i];
    const others = shuffle(Object.keys(TYPES).filter(t => t !== type)).slice(0, 2);
    const opts = shuffle([type, ...others]);
    stage.innerHTML = `
      <h2>1. What type is it?</h2>
      ${guide('There are different types of cyberbullying. Read what happened and pick the right type.')}
      <div class="panel enter">
        <div class="small">Situation ${i + 1} of ${cards.length}</div>
        <div class="big"><span class="wobble" aria-hidden="true">${em}</span></div>
        <p class="scene">${scene}</p>
        <div id="q"></div>
      </div>`;
    total++;
    question($('#q'), {
      options: opts.map(t => `${t}<span class="opt-sub">${TYPES[t]}</span>`),
      answer: opts.indexOf(type),
      why: `This is <b>${type}</b>: ${TYPES[type].toLowerCase()}.`,
      hint: 'Read the meaning under each type and match it to what happened.'
    }, () => { i++; show(); });
  };
  show();
}

/* PART 2: true or false (statements from the lesson) */
function part2() {
  setProgress(2);
  const qs = [
    ['Cyberbullying can only happen on social media.', false, 'It can happen anywhere online: games, texts, group chats, emails and more.'],
    ['Blocking someone is a way to deal with cyberbullying.', true, 'Blocking stops them contacting you.'],
    ['Cyberbullying is less harmful than face-to-face bullying.', false, 'Cyberbullying can be just as harmful. It can follow you home and be seen by lots of people.'],
    ['Cyberbullying can be reported to schools and the police.', true, 'Schools and the police take cyberbullying seriously.']
  ];
  let i = 0;
  const show = () => {
    if (i >= qs.length) return part3();
    const [text, isTrue, why] = qs[i];
    stage.innerHTML = `
      <h2>2. True or false?</h2>
      ${guide('Is this statement true or false?')}
      <div class="panel enter">
        <div class="small">Statement ${i + 1} of ${qs.length}</div>
        <div class="what">“${text}”</div>
        <div id="q"></div>
      </div>`;
    total++;
    question($('#q'), {
      grid: true,
      options: ['✅ True', '❌ False'],
      answer: isTrue ? 0 : 1,
      why,
      hint: 'Think about what we learned in the lesson.'
    }, () => { i++; show(); });
  };
  show();
}

/* PART 3: safe or risky? */
function part3() {
  setProgress(3);
  const cards = shuffle([
    ['🔒', 'Keeping your address, phone number and school private', true, 'Staying in control of your personal information keeps you safer.'],
    ['➕', 'Accepting a friend request from someone who says they know your friend', false, 'They might not be who they say they are. Only accept people you know in real life.'],
    ['📍', 'Agreeing to meet someone you have only met online', false, 'Never meet someone you only know online.'],
    ['🗣️', 'Telling a trusted adult if messages upset you', true, 'A trusted adult, like a parent, carer or teacher, can help.'],
    ['🚫', 'Blocking and reporting someone who is being unkind', true, 'Blocking and reporting helps stop it.']
  ]);
  let i = 0, safe = 0, risky = 0;
  const show = () => {
    if (i >= cards.length) return part4();
    const [em, text, isSafe, why] = cards[i];
    stage.innerHTML = `
      <h2>3. Safe or risky?</h2>
      ${guide('The easiest way to stay safe online is to stay in control of your personal information. Is this safe or risky?')}
      <div class="panel enter">
        <div class="small">Card ${i + 1} of ${cards.length}</div>
        <div class="big"><span class="wobble" aria-hidden="true">${em}</span></div>
        <div class="what">${text}</div>
        <div id="q"></div>
      </div>
      <div class="piles"><span class="pile">👍 Safe: ${safe}</span><span class="pile">⚠️ Risky: ${risky}</span></div>`;
    total++;
    question($('#q'), {
      grid: true,
      options: ['👍 Safe', '⚠️ Risky'],
      answer: isSafe ? 0 : 1,
      onRight: () => { isSafe ? safe++ : risky++; },
      why,
      hint: isSafe ? 'This helps keep you safe.' : 'Could this put you in danger?'
    }, () => { i++; show(); });
  };
  show();
}

/* PART 4: exit ticket quiz */
function part4() {
  setProgress(4);
  const qs = [
    { q: 'What is cyberbullying?', options: ['Bullying someone using the internet, phones or other digital devices', 'Playing games online with friends', 'When your phone gets a virus'], answer: 0,
      why: 'Well remembered!', hint: 'Think about the word: cyber + bullying.' },
    { q: 'Which is a good way to deal with cyberbullying?', options: ['Send something mean back', 'Block, report and tell a trusted adult', 'Keep it to yourself'], answer: 1,
      why: 'Block, report and tell someone you trust.', hint: 'Which one stops it and gets you help?' },
    { q: 'Why is it important to be respectful online?', options: ['It makes your phone faster', 'Hurtful comments can cause long-term harm to someone’s wellbeing', 'So you get more followers'], answer: 1,
      why: 'Words online can really hurt people.', hint: 'Think about how unkind comments make people feel.' }
  ];
  let i = 0;
  const show = () => {
    if (i >= qs.length) return finish();
    stage.innerHTML = `
      <h2>4. Quick quiz</h2>
      ${guide('Last part! Three quick questions.')}
      <div class="panel enter">
        <div class="small">Question ${i + 1} of ${qs.length}</div>
        <div class="what">${qs[i].q}</div>
        <div id="q"></div>
      </div>`;
    total++;
    question($('#q'), qs[i], () => { i++; show(); });
  };
  show();
}

/* FINISH */
function finish() {
  const pct = stars / total;
  const shown = pct >= .9 ? 3 : pct >= .6 ? 2 : 1;
  stage.innerHTML = `
    ${guide('You did it! You’re now a Cyberbullying Buster. 🎉')}
    <div class="panel">
      <h1>Mission complete!</h1>
      <div class="stars" aria-label="${shown} out of 3 stars">${'<span>⭐</span>'.repeat(shown)}${'<span>☆</span>'.repeat(3 - shown)}</div>
      <p>You got <b>${stars} out of ${total}</b> right first time.</p>
      <ul class="recap">
        <li>💻 Cyberbullying is bullying using the internet, phones and other devices.</li>
        <li>🔎 Types include harassment, exclusion, impersonation, outing and trolling.</li>
        <li>🚫 Block, report and tell a trusted adult.</li>
        <li>💬 Be kind and respectful online.</li>
      </ul>
      <p class="positive">💚 If it happens to you, it is never your fault, and there are always people who can help.</p>
      <button class="btn primary next" id="again">Play again</button>
    </div>`;
  face('happy');
  confetti();
  $('#again').onclick = () => { total = 0; start(); };
}

start();
</script>
</body>
</html>
